<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Katalog - Kalatera.Interior</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html"><i class="bi bi-house-door"></i> Kalatera.Interior</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link active" href="catalog.html">Katalog</a></li>
                    <li class="nav-item"><a class="nav-link" href="profile.html">Profil</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Catalog Section -->
    <section class="py-5">
        <div class="container">
            <h2 class="text-center mb-4 fw-bold">Katalog Produk</h2>
            
            <!-- Search Bar (Simple & Clean) -->
            <div class="row mb-5">
                <div class="col-md-6 mx-auto">
                    <div class="input-group shadow-sm">
                        <span class="input-group-text bg-white border-end-0">
                            <i class="bi bi-search text-muted"></i>
                        </span>
                        <input 
                            type="text" 
                            id="searchInput" 
                            class="form-control border-start-0" 
                            placeholder="Cari produk... (kitchen set, lemari, dipan, dll)"
                            autocomplete="off"
                        >
                        <button class="btn btn-outline-secondary" type="button" id="clearSearch" title="Hapus pencarian">
                            <i class="bi bi-x-lg"></i>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Loading -->
            <div id="loading" class="text-center py-5">
                <div class="spinner-border text-primary"></div>
                <p class="mt-2">Memuat katalog...</p>
            </div>

            <!-- Product Grid -->
            <div class="row" id="productGrid"></div>

            <!-- No Results (Hanya muncul saat search tidak ada hasil) -->
            <div id="noResults" class="text-center py-5 d-none">
                <i class="bi bi-search display-1 text-muted"></i>
                <h5 class="mt-3 fw-bold">Produk tidak ditemukan</h5>
                <p class="text-muted">Coba gunakan kata kunci lain</p>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="bg-dark text-white py-4">
        <div class="container text-center">
            <p>&copy; 2026 Kalatera.Interior. All rights reserved.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/catalog.js"></script>
</body>
</html>
