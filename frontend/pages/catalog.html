<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Katalog - Kalatera.Interior</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">
                <i class="bi bi-house-door"></i> Kalatera.Interior
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link active" href="catalog.html">Katalog</a></li>
                    <li class="nav-item"><a class="nav-link" href="inquiry.html">Pesan</a></li>
                    <li class="nav-item"><a class="nav-link" href="../admin/login.html">Admin</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Catalog Section -->
    <section class="py-5">
        <div class="container">
            <h2 class="text-center mb-3">Katalog Produk</h2>
            <p class="text-center text-muted mb-5">Pilih furniture custom sesuai kebutuhan Anda</p>
            
            <!-- Filter -->
            <div class="row mb-4">
                <div class="col-md-4 mx-auto">
                    <select class="form-select" id="categoryFilter">
                        <option value="">Semua Kategori</option>
                        <option value="Kitchen">Kitchen</option>
                        <option value="Bedroom">Bedroom</option>
                        <option value="Office">Office</option>
                        <option value="Living Room">Living Room</option>
                    </select>
                </div>
            </div>

            <!-- Loading -->
            <div id="loading" class="text-center py-5">
                <div class="spinner-border text-primary" role="status">
                    <span class="visually-hidden">Loading...</span>
                </div>
                <p class="mt-2">Memuat katalog...</p>
            </div>

            <!-- Product Grid -->
            <div class="row" id="productGrid"></div>

            <!-- No Products -->
            <div id="noProducts" class="text-center py-5 d-none">
                <i class="bi bi-inbox display-1 text-muted"></i>
                <p class="mt-3">Belum ada produk tersedia</p>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="bg-dark text-white py-4">
        <div class="container text-center">
            <p>&copy; 2026 Kalatera.Interior. All rights reserved.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/main.js"></script>
</body>
</html>
